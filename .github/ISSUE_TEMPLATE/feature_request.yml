name: Feature Request
description: Suggest a new feature or enhancement for Kadmos.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Feature
      description: Describe the feature or improvement you would like to see.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: How would this feature help your workflow in Kadmos?
