name: Bug Report
description: Report a bug or unexpected behavior in Kadmos.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please avoid sharing private document contents or sensitive personal file paths.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open Kadmos
        2. Click '...'
        3. Observe error
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS Version & Hardware
      placeholder: "e.g. macOS 27.2, Apple Silicon (M4)"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional Context / Screenshots
      description: Add any screenshots, logs, or extra details that help reproduce the issue.
